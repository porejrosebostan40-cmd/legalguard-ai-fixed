name: One-time lockfile refresh

on:
  push:
    branches:
      - fix/final-control-and-regression-tests

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/fix/final-control-and-regression-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-control-and-regression-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from pinned package manifest
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Commit lockfile only when it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched dependencies"
          git push origin HEAD:fix/final-control-and-regression-tests
