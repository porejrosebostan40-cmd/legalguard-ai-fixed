name: Refresh npm lockfile for feature branch

on:
  push:
    branches: ['fix/final-control-and-regression-tests']
  pull_request:
    branches: ['safety/free-core-v1']
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile without running dependency scripts
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh secure npm lockfile"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:$branch"
