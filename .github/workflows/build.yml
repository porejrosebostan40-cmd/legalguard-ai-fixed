name: LegalGuard build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile for pinned dependency updates
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Upload resolved lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
      - name: Install dependencies reproducibly
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Report resolved direct dependency versions
        run: npm ls --depth=0
      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      - name: Commit regenerated lockfile for the project branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/final-control-and-regression-tests'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "chore: refresh dependency lockfile"
            git fetch origin "${GITHUB_HEAD_REF}"
            git rebase "origin/${GITHUB_HEAD_REF}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
          fi
      # CI deliberately performs no external AI-provider requests.
      # Build verification must work without API keys or paid usage.
