name: LegalGuard build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Обновить npm до версии с исправлением resolver
        run: npm install --global npm@11.6.0
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Проверка TypeScript и сборка интерфейса
        run: npm run build
      - name: Тесты юридических инвариантов
        run: npm test
      - name: Проверка синтаксиса Android-скриптов
        run: bash -n scripts/run-local-llama-server.sh scripts/start-legalguard-android.sh scripts/setup-legalguard-android.sh
