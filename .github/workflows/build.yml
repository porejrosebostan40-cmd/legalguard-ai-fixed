name: LegalGuard build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies reproducibly
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Report resolved direct dependency versions
        run: npm ls --depth=0
      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      # CI deliberately performs no external AI-provider requests.
      # Build verification must work without API keys or paid usage.
