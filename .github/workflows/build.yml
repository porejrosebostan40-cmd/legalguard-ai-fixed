name: LegalGuard build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies reproducibly when lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
      - name: Report resolved direct dependency versions
        run: npm ls --depth=0
      - run: npm run build
      - run: npm test

      # CI deliberately performs no external AI-provider requests.
      # Build verification must work without API keys or paid usage.
